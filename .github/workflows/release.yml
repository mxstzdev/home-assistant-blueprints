name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # release-please fails on an empty package list, so wait for the first blueprint.
      - id: packages
        run: echo "count=$(jq '.packages | length' release-please-config.json)" >> "$GITHUB_OUTPUT"
      - if: steps.packages.outputs.count != '0'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
