name: Validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, to catch breaking changes in new stable and upcoming Home Assistant releases.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Picks the Home Assistant versions per blueprint, see scripts/resolve-ha-targets.sh.
  discover:
    runs-on: ubuntu-latest
    outputs:
      blocking: ${{ steps.targets.outputs.blocking }}
      scheduled: ${{ steps.targets.outputs.scheduled }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: targets
        # A separate assignment makes the step fail if the script fails.
        run: |
          targets="$(bash scripts/resolve-ha-targets.sh)"
          echo "blocking=$(jq -c .blocking <<< "${targets}")" >> "$GITHUB_OUTPUT"
          echo "scheduled=$(jq -c .scheduled <<< "${targets}")" >> "$GITHUB_OUTPUT"

  # Must pass on every run.
  check-config:
    needs: discover
    if: >-
      needs.discover.outputs.blocking != ''
      && needs.discover.outputs.blocking != '[]'
    name: ${{ matrix.blueprint }} @ ${{ matrix.ha }} (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.blocking) }}
    steps:
      - if: matrix.skip != ''
        run: echo "::warning::Skipped ${BLUEPRINT} @ ${HA} (${SKIP})"
        env:
          BLUEPRINT: ${{ matrix.blueprint }}
          HA: ${{ matrix.ha }}
          SKIP: ${{ matrix.skip }}
      - if: matrix.skip == ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - if: matrix.skip == ''
        run: bash scripts/validate-blueprint.sh "$BLUEPRINT" "$VERSION"
        env:
          BLUEPRINT: ${{ matrix.blueprint }}
          VERSION: ${{ matrix.version }}

  # The upcoming release only fails scheduled and manual runs, see result.
  check-dev:
    needs: discover
    if: >-
      needs.discover.outputs.scheduled != ''
      && needs.discover.outputs.scheduled != '[]'
    name: ${{ matrix.blueprint }} @ ${{ matrix.ha }} (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.scheduled) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: bash scripts/validate-blueprint.sh "$BLUEPRINT" "$VERSION"
        env:
          BLUEPRINT: ${{ matrix.blueprint }}
          VERSION: ${{ matrix.version }}

  # Keeps scripts/create-blueprint.sh in line with the conventions.
  scaffold:
    name: create-blueprint.sh ${{ matrix.domain }} @ ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [automation, script]
        ha: [min, stable]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: bash scripts/create-blueprint.sh -d "$DOMAIN" scaffold-check
        env:
          DOMAIN: ${{ matrix.domain }}
      - run: pipx run --spec yamllint==1.37.1 yamllint --strict --format github blueprints
      - run: bash scripts/validate-blueprint.sh "blueprints/$DOMAIN/scaffold-check" "$HA"
        env:
          DOMAIN: ${{ matrix.domain }}
          HA: ${{ matrix.ha }}

  # Single, stable check name for branch protection.
  result:
    needs: [discover, check-config, check-dev, scaffold]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "$DISCOVER" != success || "$SCAFFOLD" != success \
            || ! "$CHECK" =~ ^(success|skipped)$ ]]; then
            echo "::error::Blueprint validation failed"
            exit 1
          fi
          if [[ ! "$DEV" =~ ^(success|skipped)$ ]]; then
            message="Blueprint validation failed on the upcoming Home Assistant release"
            if [[ "$EVENT" =~ ^(schedule|workflow_dispatch)$ ]]; then
              echo "::error::${message}"
              exit 1
            fi
            echo "::warning::${message}, which only fails scheduled and manual runs"
          fi
        env:
          DISCOVER: ${{ needs.discover.result }}
          CHECK: ${{ needs.check-config.result }}
          DEV: ${{ needs.check-dev.result }}
          SCAFFOLD: ${{ needs.scaffold.result }}
          EVENT: ${{ github.event_name }}
