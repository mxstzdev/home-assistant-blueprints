version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Gives new releases time to settle. Security updates are not delayed.
    cooldown:
      default-days: 7
    # ci(deps): bump …, which release-please leaves out of the changelogs.
    commit-message:
      prefix: ci
      include: scope
    groups:
      # Major updates stay separate, since they may need workflow changes.
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Python tools in requirements.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]
